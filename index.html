/* Indian Currency Amount in Words (with Paise) */
function amountInWords(num){
  num = Math.max(0, Number(num) || 0);
  const rupees = Math.floor(num);
  const paise = Math.round((num - rupees) * 100);
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? ' ' + ones[x%10] : '');
  const three = x => (x >= 100 ? ones[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' and ' : '') : '') + two(x%100);
  function conv(x){
    if(x === 0) return 'Zero';
    let parts = [];
    const cr = Math.floor(x / 10000000); x %= 10000000;
    const lk = Math.floor(x / 100000);   x %= 100000;
    const th = Math.floor(x / 1000);     x %= 1000;
    if(cr) parts.push(conv(cr) + ' Crore');
    if(lk) parts.push(two(lk) + ' Lakh');
    if(th) parts.push(two(th) + ' Thousand');
    if(x) parts.push(three(x));
    return parts.join(' ');
  }
  let res = conv(rupees) + ' Rupees';
  if(paise > 0) res += ' and ' + two(paise) + ' Paise';
  return res + ' Only';
}

function isExpired(){
  const today = td();
  let maxDt = '';
  try{ maxDt = localStorage.getItem(K_MAXDT) || ''; }catch(e){}
  if(today > maxDt){ try{ localStorage.setItem(K_MAXDT, today); }catch(e){} maxDt = today; }
  return today > DEMO_CFG.expiryDate || maxDt > DEMO_CFG.expiryDate;
}

function daysLeft(){
  const d = dd(DEMO_CFG.expiryDate, td());
  return Math.max(0, d);
}

function stk(){
  let u=0, h=0, k=0, wKg=0;
  S.fe.forEach(e => {
    if(e.k=='P'){
      if(e.pmode=='weight'){
        const gr = GR.find(g=>g[0]==e.grade);
        if(gr && gr[2]=='H') h += (e.g||0); else u += (e.g||0);
        wKg += (e.nk||0);
      } else {
        u += (e.g||0);
        wKg += ((e.g||0)*(e.gram||500)/1000);
      }
    }
  });
  S.dh.forEach(e => { u -= e.p; h += e.p; k += e.p; });
  S.ad.forEach(a => {
    const t=a.t, p=a.p;
    if(t=='RO'){u+=p;h-=p;k-=p}else if(t=='RU'){u-=p;h+=p;k+=p}else if(t=='AU')u+=p;else if(t=='AH')h+=p;else if(t=='AK')k+=p;else if(t=='U')u-=p;else if(t=='H')h-=p;else k-=p;
  });
  S.be.forEach(e => {
    if(e.k=='S') e.rows.forEach(x => {
      const gr = GR.find(g=>g[0]==x.g);
      if(gr && gr[2]=='H') h -= (x.pcs||0); else u -= (x.pcs||0);
      wKg -= (x.nk||0);
    });
  });
  S.hk.forEach(e => k -= e.pcs);
  return {u, h, k, wKg: Math.round(wKg)};
}

function avgCost(){
  let a=0, g=0;
  S.fe.forEach(e => { if(e.k=='P' && e.g>0){ a += e.amt; g += e.g; } });
  return g ? a/g : 0;
}

function flows(){
  const o=[];
  S.fe.forEach(e=>{
    const f=fm(e.fid);
    if(e.k=='P'&&e.paid) o.push([e.date,'கொள்முதல் - '+(f&&f.name),-e.paid]);
    if(e.k=='D'||e.k=='A') o.push([e.date,(e.k=='D'?'பாக்கி பட்டுவாடா - ':'முன்பணம் - ')+(f&&f.name),-Math.abs(e.d)]);
  });
  S.be.forEach(e=>{
    const b=bm(e.bid);
    if(e.k=='S'&&e.recv) o.push([e.date,'விற்பனை - '+(b&&b.name),e.recv]);
    if(e.k=='C') o.push([e.date,'வசூல் - '+(b&&b.name),Math.abs(e.d)]);
  });
  S.hk.forEach(e=>e.recv && o.push([e.date,'மட்டை - '+e.who,e.recv]));
  S.lb.forEach(e=>o.push([e.date,'கூலி - '+e.who,-e.amt]));
  S.ex.forEach(e=>o.push([e.date,e.type,-e.amt]));
  return o;
}

function sinceFrom(f){
  const A = S.fe.filter(e=>e.fid==f.id&&e.k=='A').map(e=>e.date).sort();
  const lp = S.fe.filter(e=>e.fid==f.id&&e.k=='P').map(e=>e.date).sort().slice(-1)[0];
  return (lp && A.filter(d=>d<=lp).slice(-1)[0]) || A.slice(-1)[0] || '';
}
function advCtx(f,pdt){
  const A = S.fe.filter(e=>e.fid==f.id&&e.k=='A').map(e=>e.date).sort();
  const sinceDt = f.since || A.filter(d=>d<=pdt).slice(-1)[0] || A.slice(-1)[0] || pdt;
  const days = Math.max(0, dd(pdt,sinceDt)||0);
  const rate = (f.rate==null||f.rate==='') ? 2 : f.rate;
  return {sinceDt, days, rate};
}
function recF(f){
  if(!f) return;
  f.bal = Math.round(S.fe.filter(e=>e.fid==f.id).reduce((a,e)=>a+e.d,0)*100)/100;
  if(f.bal>=0) f.since=''; else if(!f.since) f.since=sinceFrom(f);
  const ps = S.fe.filter(e=>e.fid==f.id&&e.k=='P').map(e=>e.date).sort();
  f.last = ps.length ? ps[ps.length-1] : (f.lastm||'');
}
function recB(b){
  if(!b) return;
  b.bal = Math.round(S.be.filter(x=>x.bid==b.id).reduce((a,x)=>a+x.d,0)*100)/100;
  const s = S.be.filter(x=>x.bid==b.id&&(x.k=='S'||x.k=='H')).map(x=>x.date).sort();
  b.ls = s.length ? s[s.length-1] : '';
}
function recAll(){ S.f.forEach(recF); S.b.forEach(recB); }

function balTxt(v,ui){
  v = Math.round(v*100)/100;

function calcPW(s){
  if(!$('pw_gk')) return;
  const gk = n('pw_gk'), dp = n('pw_dp');
  if(s=='gk' || s=='dp') $('pw_dk').dataset.m = '';
  if(!$('pw_dk').dataset.m) $('pw_dk').value = gk ? +(gk * dp / 100).toFixed(2) : '';
  const dk = n('pw_dk'), nk = Math.max(0, +(gk - dk).toFixed(2));
  $('pw_nk').value = nk;
  const amt = +(nk * n('pw_rt')).toFixed(2);
  $('pw_amt').value = amt;
  const net = +(amt - n('pw_cut')).toFixed(2);
  $('pw_net').value = net;
  if(s!='paid' && s!='e' && !$('pw_paid').dataset.m) $('pw_paid').value = net;
  const f0 = fm($('pw_f').value);
  if(!f0){ $('pw_info').textContent=''; return; }
  const effBal = f0.bal - (ed && ed.k=='P' && ed.old.fid==f0.id ? ed.old.d : 0);
  $('pw_info').textContent = effBal>0 ? 'பழைய பாக்கி (கொடுக்க வேண்டியது): '+R2(effBal) : effBal<0 ? 'பழைய முன்பணம்: '+R2(-effBal) : 'கணக்கு இருப்பு: இல்லை';
  $('pw_cl').value = balTxt(effBal + net - n('pw_paid'), 1);
}

function savPW(w){
  const isEdit = !!(ed && ed.old && ed.k=='P');
  if(!checkDemoLimit(isEdit)) return;
  const f = fm($('pw_f').value), gk = n('pw_gk'), dk = n('pw_dk'), nk = n('pw_nk'), rt = n('pw_rt');
  if(!f || gk<=0) return alert('சப்ளையர் & காட்டா எடை தேவை');
  if(dk<0 || dk>=gk) return alert('கழிவு எடை சரியாக உள்ளிடவும்');
  if(rt<=0) return alert('1 கிலோ விலை உள்ளிடவும்');
  const gr = GR.find(x=>x[0]==$('pw_gr').value) || GR[0];
  const amt = +(nk * rt).toFixed(2), cut = n('pw_cut'), net = +(amt - cut).toFixed(2), paid = n('pw_paid');
  const r = {
    k:'P', pmode:'weight', invNo: isEdit && ed.old.invNo ? ed.old.invNo : 'PB-'+String(++S._invSeq).padStart(3,'0'),
    fid:f.id, date:$('pw_dt').value, grade:gr[0], hsn:gr[3], g:n('pw_pcs'),
    gk, dp:n('pw_dp'), dk, nk, rate:rt, amt, cut, net, int:0, pr:0, fin:net, paid,
    mode:$('pw_md').value, note:$('pw_note').value, d:+(net-paid).toFixed(2), id:uid()
  };
  putF(r); consumeDemoSlot(isEdit); recF(f); save(); render();
  if(w) showBillDoc(buildPurchaseDoc(r, f, f.bal), f.ph);
}

function fSel(){ ['pi','pq','pw'].forEach(i=>{if($(i))$(i).dataset.m=''}); $('pct').checked=false; ctog(1); $('pcr').value=0; $('pc').dataset.m=''; calcP('f'); }
function ctog(init){
  const on = $('pct') && $('pct').checked;
  document.querySelectorAll('.cut').forEach(e=>e.classList.toggle('hid',!on));
  if(init) return;
  if(on) $('pcr').value=1.25; else { $('pcr').value=0; $('pc').dataset.m=''; }
  calcP('pcr');
}
function calcP(s){
  if(!$('pg')) return;
  const g = n('pg');
  if(s=='g'||s=='pp') $('pd').dataset.m='';
  if(s=='g'||s=='pcr') $('pc').dataset.m='';
  if(!$('pd').dataset.m) $('pd').value = Math.round(g*n('pp')/100);
  const bill = g - n('pd'); $('pb').value = bill;
  const amt = bill * n('pr'); $('pa').value = amt;
  if(!$('pc').dataset.m) $('pc').value = +(g*n('pcr')).toFixed(2);
  const net = amt - n('pc'); $('pn').value = net;
  const f0 = fm($('pf0').value); if(!f0){ $('pinfo').textContent=''; return; }
  const f = Object.assign({}, f0, {bal: f0.bal - (ed&&ed.k=='P'&&ed.old.fid==f0.id?ed.old.d:0)});
  const ac = f.bal<0 ? advCtx(f,$('pdt').value) : null;
  $('pinfo').innerHTML = f.bal<0 ? `முன்பணம்: ${R(-f.bal)} (வட்டி ${ac.rate}%, ${ac.days} நாட்கள்)` : f.bal>0 ? `பழைய பாக்கி (கொடுக்க வேண்டியது): ${R(f.bal)}` : 'கணக்கு இருப்பு: இல்லை';
  let it=0, pq=0;
  if(f.bal<0){
    $('pint').style.display='block';
    const days=ac.days, pr=-f.bal;
    if(['i','f','dt'].includes(s)) $('pi').dataset.m='';
    if(s!='pq'&&s!='pw'&&s!='e') $('pq').dataset.m='';
    if(!$('pi').dataset.m) $('pi').value = intr(pr,ac.rate,days,document.querySelector('[name=im]:checked').value);
    it = n('pi');
    $('ptxt').textContent = `${days} நாட்கள் | அசல் ${R(pr)} | மாத வட்டி ${ac.rate}%`;
    if(!$('pq').dataset.m) $('pq').value = Math.min(pr, Math.max(0, net-it));
    pq = n('pq');
  } else {
    $('pint').style.display='none'; $('pi').value=0; $('pq').value=0;
  }
  const fin = net - it - pq; $('pfin').value = fin;
  if(s!='pw'&&s!='e') $('pw').dataset.m='';
  if(!$('pw').dataset.m) $('pw').value = fin;
  $('pcl').value = balTxt(f.bal + net - it - n('pw'), 1);
}
function savP(w){
  const isEdit = !!(ed && ed.old && ed.k=='P');
  if(!checkDemoLimit(isEdit)) return;
  const f = fm($('pf0').value), g = n('pg');
  if(!f || g<=0) return alert('விவசாயி & காய்கள் தேவை');
  if(n('pd')<0 || n('pd')>=g) return alert('இலாபக் காய் எண்ணிக்கை சரியாக உள்ளிடவும்');
  if(n('pr')<=0) return alert('1 காய் விலை உள்ளிடவும்');
  const r = {
    k:'P', pmode:'count', invNo: isEdit && ed.old.invNo ? ed.old.invNo : 'PB-'+String(++S._invSeq).padStart(3,'0'),
    fid:f.id, date:$('pdt').value, g, ded:n('pd'), pp:n('pp'), bill:n('pb'), rate:n('pr'), amt:n('pa'),
    cut:n('pc'), gram:n('pgm'), net:n('pn'), int:n('pi'), pr:n('pq'), fin:n('pfin'), paid:n('pw'),
    mode:$('pm').value, im:(document.querySelector('[name=im]:checked')||{}).value||'', note:$('pnote').value, id:uid()
  };
  r.d = +(r.net - r.int - r.paid).toFixed(2);
  putF(r); consumeDemoSlot(isEdit); recF(f);
  if(f.bal<0 && !f.since) f.since=r.date;
  if(f.bal<0 && r.pr>0) f.since=r.date;
  save(); render();
  if(w) showBillDoc(buildPurchaseDoc(r, f, f.bal), f.ph);
}

function rowsS(){
  return [...$('rows').children].map(c => {
    const q = s => c.querySelector(s);
    const gk = +q('.gk').value || 0;
    const dp = +q('.dp').value || 0;
    const dk = q('.dk').dataset.m ? (+q('.dk').value || 0) : +(gk * dp / 100).toFixed(2);
    if(!q('.dk').dataset.m) q('.dk').value = gk ? dk : '';
    const effDp = gk ? +((dk/gk)*100).toFixed(2) : dp;
    const nk = Math.max(0, +(gk - dk).toFixed(2));
    const rate = +q('.rt').value || 0;
    const pcs = +q('.pc').value || 0;
    const tot = +(nk * rate).toFixed(2);
    q('.nk').textContent = nk;
    q('.tt').textContent = R2(tot);
    q('.av').textContent = pcs ? Math.round(gk*1000/pcs)+'g/காய்' : '';
    const gCode = q('.gr').value;
    const gObj = GR.find(x=>x[0]==gCode) || GR[0];
    return { g:gCode, itemName:gObj[1], hsn:q('.hsn').value.trim()||gObj[3], pcs, gk, dp:effDp, dk, nk, rate, tot };
  });
}

function calcS(){
  if(!$('rows')) return;
  const rs = rowsS();
  const tot = +(rs.reduce((a,x)=>a+x.tot,0)).toFixed(2);
  const b0 = bm($('sb').value);
  const b = b0 && Object.assign({}, b0, {bal: b0.bal - (ed&&ed.k=='S'&&ed.old.bid==b0.id?ed.old.d:0)});
  $('st').textContent = R2(tot);
  const prev = b ? b.bal : 0, rc = n('sr');
  $('scl').textContent = balTxt(prev + tot - rc, 1);
  if($('ssum')){
    $('ssum').innerHTML = '<table>' + [
      ['இன்றைய பில் மொத்தம் (Sub Total)', R2(tot)],
      ['பழைய பாக்கி / முன்பணம்', balTxt(prev,1)],
      ['மொத்தம் வர வேண்டிய தொகை', balTxt(prev+tot,1)],
      ['இப்போது வாங்கிய தொகை', R2(rc)],
      ['புதிய பாக்கி', balTxt(prev+tot-rc,1)]
    ].map(r=>`<tr><td>${r[0]}</td><td style="text-align:right"><b>${r[1]}</b></td></tr>`).join('') + '</table>';
  }
  $('sinfo').textContent = b ? (b.bal>0?'பழைய பாக்கி: '+R2(b.bal):b.bal<0?'முன்பணம்: '+R2(-b.bal):'கணக்கு இருப்பு: இல்லை') + (b.gstin?' | GSTIN: '+b.gstin:'') : '';
}

function savS(w){
  const isEdit = !!(ed && ed.old && ed.k=='S');
  if(!checkDemoLimit(isEdit)) return;
  const b = bm($('sb').value), rs = rowsS().filter(x=>x.gk>0);
  if(!b || !rs.length) return alert('வியாபாரி & காட்டா எடை தேவை');
  for(const x of rs){
    if(x.gk<=0) return alert('காட்டா எடை உள்ளிடவும்');
    if(x.rate<=0) return alert('1 கிலோ விலை உள்ளிடவும்');
    if(x.dk<0 || x.dk>=x.gk) return alert('கழிவு எடை சரியாக உள்ளிடவும்');
  }
  const total = +(rs.reduce((a,x)=>a+x.tot,0)).toFixed(2), recv = n('sr');
  const invNo = $('sinv').value.trim() || String(S._invSeq);
  const r = {
    k:'S', invNo, bid:b.id, date:$('sd').value, pos:$('spos').value.trim()||'33-Tamil Nadu',
    veh:$('sveh').value.trim(), rows:rs, total, recv, mode:$('smd').value, note:$('sn').value.trim(),
    d:+(total-recv).toFixed(2), id:uid()
  };
  if(!isEdit) S._invSeq = Math.max(S._invSeq + 1, (parseInt(invNo)||S._invSeq) + 1);
  putB(r, b); consumeDemoSlot(isEdit); save(); render();
  if(w) showBillDoc(buildSalesDoc(r, b, b.bal), b.ph);
}

/* ---- Reports & P&L ---- */
function plCalc(inR){
  const sales = S.be.filter(e=>e.k=='S'&&inR(e.date));
  const pcs = sales.reduce((a,e)=>a+e.rows.reduce((s,x)=>s+(x.pcs||0),0),0);
  const A1 = sales.reduce((a,e)=>a+e.total,0);
  const A2 = S.hk.filter(e=>inR(e.date)).reduce((a,e)=>a+e.tot,0);
  const A3 = S.fe.filter(e=>e.k=='P'&&inR(e.date)).reduce((a,e)=>a+(e.int||0),0);
  const purch = S.fe.filter(e=>e.k=='P'&&inR(e.date)).reduce((a,e)=>a+e.amt,0);
  const B2 = S.dh.filter(e=>inR(e.date)).reduce((a,e)=>a+e.cost,0);
  const B3 = S.ex.filter(e=>inR(e.date)).reduce((a,e)=>a+e.amt,0);
  return {pcs, A1, A2, A3, purch, B2, B3, net: A1+A2+A3-purch-B2-B3};
}

function openEntryBill(k, pid, eid){

  const e = x.e, run = x.run;
  if(e.k=='S') return showBillDoc(buildSalesDoc(e, p, run), p.ph);
  if(e.k=='P') return showBillDoc(buildPurchaseDoc(e, p, run), p.ph);
  if(e.k=='H'){
    const hk = S.hk.find(h=>h.id==e.hk) || {id:e.id, date:e.date, who:p.name, pcs:e.pcs, rate:e.pcs?e.total/e.pcs:1, tot:e.total, recv:e.recv};

  }
  return showBillDoc(buildReceiptDoc(k, e, p, run), p.ph);
}

function fmtWADoc(doc){

    `🥥 *${C.name}* (DEMO)`,
    `📍 ${C.place} | 📱 ${C.phone}`,
    `━━━━━━━━━━━━━━━━━━━━`,
    `*${doc.type}* · #${doc.invNo}`,
    `📅 தேதி: *${doc.date}*`,
    `👤 ${doc.partyLabel}: *${doc.partyName}*`,
    ...(doc.partyGstin?[`🧾 GSTIN: ${doc.partyGstin}`]:[]),
    `────────────────────`
  ];
  doc.rows.forEach((r,i)=>{
    lines.push(`*${i+1}) ${r[1]}*`);
    doc.cols.slice(2).forEach((col,ci)=> lines.push(`${col}: ${r[ci+2]}`));
    lines.push('');
  });
  lines.push(`────────────────────`);
  doc.summary.forEach(([l,v,hi])=> lines.push(hi ? `💰 *${l}: ${v}*` : `${l}: ${v}`));
  lines.push(`━━━━━━━━━━━━━━━━━━━━`, `⚠️ _DEMO SAMPLE — NOT FOR OFFICIAL BILLING_`, `Software Demo by *${DEMO_CFG.devName}* · 📞 ${DEMO_CFG.devPhoneShow}`);
  return lines.join('\n');
}

/* ---- Native High-Res A4 Canvas -> PNG & True A4 PDF (Offline, No External Lib) ---- */
const A4_FONT = "'Inter','Noto Sans Tamil','Latha','Nirmala UI',system-ui,sans-serif";
async function renderA4Canvas(doc){
  try{ if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1000))]); }catch(e){}
  const W = 1240, H = 1754, M_ = 54, IW = W - 2*M_;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0,0,W,H);

  // Outer border
  cx.strokeStyle = '#111'; cx.lineWidth = 2; cx.strokeRect(M_, M_, IW, H - 2*M_);

  // Diagonal Watermark (Drawn behind content)
  cx.save();
  cx.fillStyle = 'rgba(220,38,38,0.11)';
  cx.font = '700 44px ' + A4_FONT;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  [480, 920, 1360].forEach(wy => {
    cx.save(); cx.translate(W/2, wy); cx.rotate(-0.52);
    cx.fillText(DEMO_CFG.watermarkText, 0, 0);
    cx.restore();
  });
  cx.restore();

  const C = DEMO_CFG.company;
  const txt = (s,x,y,sz,b,al,col) => {
    cx.fillStyle = col || '#111'; cx.font = (b?'700 ':'400 ') + sz + 'px ' + A4_FONT;
    cx.textAlign = al || 'left'; cx.textBaseline = 'top';
    cx.fillText(String(s||''), x, y);
  };
  const wrap = (s, maxW, sz, b) => {
    cx.font = (b?'700 ':'400 ') + sz + 'px ' + A4_FONT;
    const words = String(s||'').split(/\s+/), out = []; let cur = '';
    words.forEach(w => {
      const t_ = cur ? cur+' '+w : w;
      if(cx.measureText(t_).width <= maxW) cur = t_;
      else { if(cur) out.push(cur); cur = w; }
    });
    if(cur) out.push(cur);
    return out;
  };
  const box = (x,y,w,h,fill) => {
    if(fill){ cx.fillStyle = fill; cx.fillRect(x,y,w,h); }
    cx.strokeStyle = '#333'; cx.lineWidth = 1.4; cx.strokeRect(x,y,w,h);
  };

  let y = M_ + 22;
  // Title
  txt(doc.type + '  [DEMO SAMPLE]', W/2, y, 26, 1, 'center', '#1B4332');
  y += 38;
  cx.strokeStyle = '#1B4332'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(M_+18, y); cx.lineTo(W-M_-18, y); cx.stroke();
  y += 16;

  // Company + Invoice Meta Box
  const bxX = M_ + 18, bxW = IW - 36;
  box(bxX, y, bxW, 138);
  txt(C.name, bxX+16, y+14, 26, 1, 'left', '#1B4332');
  txt(C.address, bxX+16, y+48, 17, 0);
  txt(`Phone: ${C.phone}   |   Email: ${C.email}`, bxX+16, y+76, 17, 0);
  txt(`GSTIN: ${C.gstin}   |   State: ${C.state}`, bxX+16, y+104, 17, 1);

  txt(`Invoice No: ${doc.invNo}`, bxX+bxW-16, y+18, 18, 1, 'right');
  txt(`Date: ${doc.date}`, bxX+bxW-16, y+46, 18, 0, 'right');
  txt(`Place of Supply: ${doc.pos}`, bxX+bxW-16, y+74, 17, 0, 'right');
  if(doc.veh) txt(`Vehicle No: ${doc.veh}`, bxX+bxW-16, y+102, 17, 0, 'right');
  y += 154;

  // Bill To Box
  box(bxX, y, bxW, 118, '#fafaf9');
  txt(doc.partyLabel.toUpperCase(), bxX+16, y+12, 15, 1, 'left', '#1B4332');
  txt(doc.partyName, bxX+16, y+34, 21, 1);
  if(doc.partyAddr) txt(doc.partyAddr, bxX+16, y+64, 16, 0);
  if(doc.partyPh) txt('Contact No: '+doc.partyPh, bxX+16, y+88, 16, 0);

  const midX = bxX + bxW*0.58;
  txt('GSTIN: ' + (doc.partyGstin || 'Unregistered / N/A'), midX, y+34, 17, 1);
  txt('State: ' + (doc.partyState || '33-Tamil Nadu'), midX, y+62, 17, 0);
  if(doc.note) txt('Note: ' + doc.note.slice(0,42), midX, y+88, 15, 0, 'left', '#444');
  y += 136;

  // Item Table
  const nc = doc.cols.length;
  const colW = nc===9 ? [42,248,96,76,112,138,108,104,172] : nc===7 ? [46,320,120,130,120,130,230] : Array(nc).fill(Math.floor(bxW/nc));
  const sumW = colW.reduce((a,b)=>a+b,0);
  const scale = bxW / sumW;
  const cw = colW.map(w => w * scale);

  // Header row
  const hh = 46;
  box(bxX, y, bxW, hh, '#1B4332');
  let cxX = bxX;
  doc.cols.forEach((col, i) => {
    if(i>0){ cx.strokeStyle='#fff'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(cxX,y); cx.lineTo(cxX,y+hh); cx.stroke(); }
    const ls = wrap(col, cw[i]-10, 15, 1);
    ls.slice(0,2).forEach((ln,li) => txt(ln, cxX + cw[i]/2, y + (ls.length>1?6:14) + li*18, 15, 1, 'center', '#fff'));
    cxX += cw[i];
  });
  y += hh;

  // Data rows
  const allRows = [...doc.rows, doc.totalRow];
  allRows.forEach((r, ri) => {
    const isTot = ri === allRows.length - 1;
    const rh = isTot ? 42 : 48;
    box(bxX, y, bxW, rh, isTot ? '#f3f4f6' : '#fff');
    let rx = bxX;
    r.forEach((val, ci) => {
      if(ci>0){ cx.strokeStyle='#333'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(rx,y); cx.lineTo(rx,y+rh); cx.stroke(); }
      const al = ci===0 ? 'center' : (ci>=3 || (nc<=4 && ci===nc-1)) ? 'right' : 'left';
      const tx = al==='center' ? rx+cw[ci]/2 : al==='right' ? rx+cw[ci]-8 : rx+8;
      const ls = wrap(val, cw[ci]-14, 15, isTot);
      ls.slice(0,2).forEach((ln,li)=> txt(ln, tx, y + (ls.length>1?5:13) + li*18, 15, isTot, al));
      rx += cw[ci];
    });
    y += rh;
  });

  y += 22;

  // Bottom 2 Columns: Left (Words + Bank) | Right (Summary)
  const leftW = bxW * 0.55, rightW = bxW - leftW - 18, rightX = bxX + leftW + 18;
  // Left Box 1: Amount in Words
  const wLines = wrap(amountInWords(doc.grandTotal), leftW - 24, 16, 1);
  const wbH = 44 + wLines.length * 22;
  box(bxX, y, leftW, wbH);
  txt('Invoice Amount In Words:', bxX+12, y+10, 15, 1, 'left', '#1B4332');
  wLines.forEach((ln,i)=> txt(ln, bxX+12, y+34+i*22, 16, 1));

  // Left Box 2: Bank Details
  const bkY = y + wbH + 14;
  box(bxX, bkY, leftW, 134);
  txt('Bank Details (Demo):', bxX+12, bkY+10, 15, 1, 'left', '#1B4332');
  txt('Bank: ' + C.bankName, bxX+12, bkY+36, 15, 0);
  txt(`A/c No: ${C.accNo}   |   IFSC: ${C.ifsc}`, bxX+12, bkY+60, 15, 0);
  txt('Holder: ' + C.accHolder, bxX+12, bkY+84, 15, 0);
  txt('UPI ID: ' + C.upiId, bxX+12, bkY+108, 15, 1, 'left', '#1B4332');

  // Right: Summary Table
  let sy = y;
  doc.summary.forEach(([l,v,hi]) => {
    const sh = hi ? 42 : 36;
    box(rightX, sy, rightW, sh, hi ? '#ecfdf5' : '#fff');
    txt(l, rightX+10, sy+10, hi?16:15, hi?1:0);
    txt(v, rightX+rightW-10, sy+10, hi?17:15, 1, 'right');
    sy += sh;
  });

  const sigY = Math.max(bkY + 150, sy + 20, H - 235);
  box(bxX, sigY, bxW, 126);
  txt('Terms & Conditions:', bxX+14, sigY+14, 15, 1);
  txt('1. Weight & deduction checked and agreed at dispatch.', bxX+14, sigY+38, 14, 0, 'left', '#444');
  txt('2. RESTRICTED DEMO SAMPLE — Not valid for official tax/billing use.', bxX+14, sigY+60, 14, 1, 'left', '#b91c1c');

  txt('For ' + C.name, bxX+bxW-16, sigY+16, 17, 1, 'right');
  cx.strokeStyle='#333'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(bxX+bxW-210, sigY+94); cx.lineTo(bxX+bxW-16, sigY+94); cx.stroke();
  txt('Authorized Signatory', bxX+bxW-16, sigY+100, 15, 0, 'right');

  txt(`Software Demo by ${DEMO_CFG.devName} · ${DEMO_CFG.devTitle} · Ph: ${DEMO_CFG.devPhoneShow}`, W/2, H - M_ - 26, 14, 0, 'center', '#555');
  return cv;
}

const cvBlob = (cv,type,q) => new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('Encode failed')),type,q));
function pdfFromJpegA4(jb, pw, ph){
  const Wp = 595.28, Hp = 841.89; // True A4 in PDF points
  const enc = s => new TextEncoder().encode(s), parts = [], off = []; let len = 0;
  const push = b => { parts.push(b); len += b.length; };
  const obj = (n,head,stream) => { off[n]=len; push(enc(n+' 0 obj\n'+head+'\n')); if(stream){push(enc('stream\n'));push(stream);push(enc('\nendstream\n'));} push(enc('endobj\n')); };
  push(enc('%PDF-1.4\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wp} ${Hp}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>`);
  obj(4,`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>`, jb);
  const cs = `q ${Wp} 0 0 ${Hp} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>`, enc(cs));
  const xo = len; let x = 'xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) x += String(off[i]).padStart(10,'0')+' 00000 n \n';
  x += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`;
  push(enc(x));
  return new Blob(parts, {type:'application/pdf'});
}

function dlBlob(b, name){
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); }, 3000);
}

async function shareFile(b, name, title){
  let f = null;
  try{ f = new File([b], name, {type:b.type}); }catch(e){}
  if(f && navigator.share && navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title}); return '✅ பகிரப்பட்டது'; }
    catch(e){ if(e && e.name==='AbortError') return ''; }
  }
  dlBlob(b, name);
  return '⬇️ Share ஆதரவு இல்லை — கோப்பு Download செய்யப்பட்டது';
}

      <button class="btn x" id="bmdp">⬇️ Download A4 PDF</button>
      <button class="btn x" id="bmdi">⬇️ Download A4 PNG</button>
      <button class="btn" onclick="window.print()">🖨️ Print</button>

  </div>`;

    if(mode==='t80') $('bmReceipt').className='w80';
  });

  $('bmw').onclick = () => {
    let d = (ph||'').replace(/\D/g,'').replace(/^0+/,'');
    if(d.length===10) d = '91'+d;
    window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(fmtWADoc(doc)), '_blank');
  };
  $('bmsp').onclick = async () => { msg('⏳ A4 PDF தயாராகிறது...'); const r=await prepA4(); msg(await shareFile(r.pdf, fname('pdf'), 'Demo A4 Invoice')); };
  $('bmsi').onclick = async () => { msg('⏳ A4 Image தயாராகிறது...'); const r=await prepA4(); msg(await shareFile(r.png, fname('png'), 'Demo A4 Invoice')); };
  $('bmdp').onclick = async () => { msg('⏳ A4 PDF பதிவிறக்கம்...'); const r=await prepA4(); dlBlob(r.pdf, fname('pdf')); msg('⬇️ A4 PDF Download செய்யப்பட்டது'); };
  $('bmdi').onclick = async () => { msg('⏳ A4 PNG பதிவிறக்கம்...'); const r=await prepA4(); dlBlob(r.png, fname('png')); msg('⬇️ A4 PNG Download செய்யப்பட்டது'); };
}

function trAll(){
  if(lang!=='en') return;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let node;
  while(node = w.nextNode()){
    const p = node.parentNode;
    if(!p || (p.closest && (p.closest('#bmA4') || p.closest('#bmReceipt'))) || p.tagName==='STYLE' || p.tagName==='SCRIPT' || p.tagName==='TEXTAREA') continue;
    let v = node.nodeValue, o = v;
    for(const [a,b] of EN) if(v.includes(a)) v = v.split(a).join(b);
    if(v !== o) node.nodeValue = v;
  }
}
function setLang(){
  lang = lang==='ta' ? 'en' : 'ta';
  try{ localStorage.setItem(K_LANG, lang); }catch(e){}
  render();
}

function syncBarHeight(){
  const db = $('demoBar');
  if(db) document.documentElement.style.setProperty('--dbh', db.offsetHeight+'px');
}
addEventListener('resize', syncBarHeight);

/* ---- Boot ---- */
recAll();
syncBarHeight();
if(isExpired()) showExpiryLock();
else render();
